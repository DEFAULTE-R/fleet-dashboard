<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fleet Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  background: #0b1220;
  color: #e5e7eb;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  padding: 20px;
}

/* HEADER */
h1 {
  margin-bottom: 25px;
}

/* CARDS */
.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
  margin-bottom: 25px;
}

.card {
  background: #111827;
  padding: 18px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

/* SECTIONS */
.section {
  background: #111827;
  padding: 18px;
  border-radius: 12px;
  margin-bottom: 20px;
}

/* DEVICE LIST */
.device {
  display: flex;
  justify-content: space-between;
  padding: 10px;
  border-bottom: 1px solid #1f2937;
}

.device:hover {
  background: #1f2937;
}

/* STATUS COLORS */
.good { color: #22c55e; }
.mid { color: #eab308; }
.bad { color: #ef4444; }

/* ALERTS */
.alert {
  display: flex;
  justify-content: space-between;
  padding: 8px;
  border-bottom: 1px solid #1f2937;
}

button {
  background: #ef4444;
  border: none;
  padding: 4px 8px;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  opacity: 0.8;
}

/* CHART */
canvas {
  margin-top: 10px;
}

/* DROPDOWN */
select {
  background: #0b1220;
  color: white;
  border: 1px solid #374151;
  padding: 5px;
  border-radius: 6px;
}
</style>
</head>

<body>

<h1>⚙️ Fleet Monitoring Dashboard</h1>

<div class="cards">
  <div class="card">Total<br><h2 id="total">0</h2></div>
  <div class="card">Healthy<br><h2 id="healthy">0</h2></div>
  <div class="card">Warning<br><h2 id="warning">0</h2></div>
  <div class="card">Error<br><h2 id="error">0</h2></div>
</div>

<div class="section">
  <h2>Devices</h2>
  <div id="devices"></div>
</div>

<div class="section">
  <h2>📊 Device Metrics</h2>
  <select id="deviceSelect"></select>
  <canvas id="deviceChart"></canvas>
</div>

<div class="section">
  <h2>🚨 Alerts</h2>
  <div id="alerts"></div>
</div>

<script>
let chart;
let labels = [];
let tempData = [];
let cpuData = [];
let memData = [];
let selectedDevice = null;

function healthClass(h) {
  if (h > 70) return "good";
  if (h > 40) return "mid";
  return "bad";
}

async function resolveAlert(id) {
  await fetch(`/api/alerts/${id}/resolve`, { method: "POST" });
}

async function load() {
  const res = await fetch('/api/fleet/status');
  const data = await res.json();

  total.innerText = data.total_devices;
  healthy.innerText = data.healthy;
  warning.innerText = data.warning;
  error.innerText = data.error;

  const container = document.getElementById('devices');
  container.innerHTML = '';

  const select = document.getElementById('deviceSelect');
  select.innerHTML = '';

  data.devices.forEach(d => {
    const div = document.createElement('div');
    div.className = 'device';

    div.innerHTML = `
      <span>${d.device_id} ${d.anomaly ? "⚠️" : ""}</span>
      <span class="${healthClass(d.health)}">Health: ${d.health}</span>
    `;

    container.appendChild(div);

    const opt = document.createElement('option');
    opt.value = d.device_id;
    opt.text = d.device_id;
    select.appendChild(opt);
  });

  if (!selectedDevice && data.devices.length > 0) {
    selectedDevice = data.devices[0].device_id;
  }

  select.value = selectedDevice;

  select.onchange = () => {
    selectedDevice = select.value;
    labels = [];
    tempData = [];
    cpuData = [];
    memData = [];
  };

  if (selectedDevice) {
    const res2 = await fetch(`/api/devices/${selectedDevice}/metrics`);
    const metrics = await res2.json();

    if (metrics.metrics.length > 0) {
      const m = metrics.metrics[0];

      const time = new Date().toLocaleTimeString();
      labels.push(time);

      tempData.push(m.temperature_c);
      cpuData.push(m.cpu_usage);
      memData.push(m.memory_usage);

      if (labels.length > 20) {
        labels.shift();
        tempData.shift();
        cpuData.shift();
        memData.shift();
      }
    }
  }

  if (!chart) {
    const ctx = document.getElementById('deviceChart').getContext('2d');
    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: 'Temp', data: tempData },
          { label: 'CPU', data: cpuData },
          { label: 'Memory', data: memData }
        ]
      }
    });
  } else {
    chart.data.labels = labels;
    chart.data.datasets[0].data = tempData;
    chart.data.datasets[1].data = cpuData;
    chart.data.datasets[2].data = memData;
    chart.update();
  }

  const alertRes = await fetch('/api/alerts');
  const alertData = await alertRes.json();

  const alertBox = document.getElementById('alerts');
  alertBox.innerHTML = '';

  const active = alertData.alerts.filter(a => a.resolved === 0);
  const resolved = alertData.alerts.filter(a => a.resolved === 1);

  alertBox.innerHTML = "<h3>🔴 Active Alerts</h3>";

  active.forEach(a => {
    const div = document.createElement('div');
    div.className = 'alert';

    div.innerHTML = `
      <span>${a.alert_type} - ${a.device_id}</span>
      <button onclick="resolveAlert(${a.id})">Resolve</button>
    `;

    alertBox.appendChild(div);
  });

  const title = document.createElement('h3');
  title.innerText = "✅ Resolved Alerts";
  title.style.marginTop = "10px";
  alertBox.appendChild(title);

  resolved.slice(0,5).forEach(a => {
    const div = document.createElement('div');
    div.className = 'alert';
    div.style.opacity = "0.5";
    div.innerText = `${a.alert_type} - ${a.device_id}`;
    alertBox.appendChild(div);
  });
}

setInterval(load, 2000);
</script>

</body>
</html>
