<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fleet Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { background:#0f172a; color:#e2e8f0; font-family:Arial; padding:20px; }
.cards { display:flex; gap:20px; margin-bottom:30px; }
.card { background:#1e293b; padding:20px; border-radius:10px; width:150px; }

.devices, .alerts, .chart-container {
  background:#1e293b; padding:20px; border-radius:10px; margin-bottom:20px;
}

.device { padding:6px; border-bottom:1px solid #334155; }

.alert {
  padding:8px;
  border-bottom:1px solid #334155;
  display:flex;
  justify-content:space-between;
}

button {
  background:#ef4444;
  border:none;
  color:white;
  padding:4px 8px;
  cursor:pointer;
}

.good { color:#22c55e; }
.mid { color:#eab308; }
.bad { color:#ef4444; }

select { margin-bottom:10px; padding:5px; background:#0f172a; color:white; }
</style>
</head>

<body>

<h1>⚙️ Fleet Dashboard</h1>

<div class="cards">
  <div class="card">Total<br><h2 id="total">0</h2></div>
  <div class="card">Healthy<br><h2 id="healthy">0</h2></div>
  <div class="card">Warning<br><h2 id="warning">0</h2></div>
  <div class="card">Error<br><h2 id="error">0</h2></div>
</div>

<div class="devices">
  <h2>Devices</h2>
  <div id="devices"></div>
</div>

<div class="chart-container">
  <h2>📊 Device Metrics</h2>
  <select id="deviceSelect"></select>
  <canvas id="deviceChart"></canvas>
</div>

<div class="alerts">
  <h2>🚨 Alerts</h2>
  <div id="alerts"></div>
</div>

<script>
let chart;
let labels = [];
let tempData = [];
let cpuData = [];
let memData = [];
let selectedDevice = null;

function healthClass(h) {
  if (h > 70) return "good";
  if (h > 40) return "mid";
  return "bad";
}

async function resolveAlert(id) {
  await fetch(`/api/alerts/${id}/resolve`, { method: "POST" });
}

async function load() {
  const res = await fetch('/api/fleet/status');
  const data = await res.json();

  document.getElementById('total').innerText = data.total_devices;
  document.getElementById('healthy').innerText = data.healthy;
  document.getElementById('warning').innerText = data.warning;
  document.getElementById('error').innerText = data.error;

  const container = document.getElementById('devices');
  container.innerHTML = '';

  const select = document.getElementById('deviceSelect');
  select.innerHTML = '';

  data.devices.forEach(d => {
    const div = document.createElement('div');
    div.className = 'device';

    div.innerHTML = `
      ${d.device_id} |
      Temp:${d.temperature_c}°C |
      CPU:${d.cpu_usage}% |
      <span class="${healthClass(d.health)}">Health:${d.health}</span>
    `;

    container.appendChild(div);

    const opt = document.createElement('option');
    opt.value = d.device_id;
    opt.text = d.device_id;
    select.appendChild(opt);
  });

  if (!selectedDevice && data.devices.length > 0) {
    selectedDevice = data.devices[0].device_id;
  }

  select.value = selectedDevice;

  select.onchange = () => {
    selectedDevice = select.value;
    labels = [];
    tempData = [];
    cpuData = [];
    memData = [];
  };

  if (selectedDevice) {
    const res2 = await fetch(`/api/devices/${selectedDevice}/metrics`);
    const metrics = await res2.json();

    if (metrics.metrics.length > 0) {
      const m = metrics.metrics[0];

      const time = new Date().toLocaleTimeString();
      labels.push(time);

      tempData.push(m.temperature_c);
      cpuData.push(m.cpu_usage);
      memData.push(m.memory_usage);

      if (labels.length > 20) {
        labels.shift();
        tempData.shift();
        cpuData.shift();
        memData.shift();
      }
    }
  }

  if (!chart) {
    const ctx = document.getElementById('deviceChart').getContext('2d');
    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          { label: 'Temperature', data: tempData },
          { label: 'CPU %', data: cpuData },
          { label: 'Memory %', data: memData }
        ]
      }
    });
  } else {
    chart.data.labels = labels;
    chart.data.datasets[0].data = tempData;
    chart.data.datasets[1].data = cpuData;
    chart.data.datasets[2].data = memData;
    chart.update();
  }

  // ALERTS (only unresolved)
  const alertRes = await fetch('/api/alerts');
  const alertData = await alertRes.json();

  const alertBox = document.getElementById('alerts');
  alertBox.innerHTML = '';

  alertData.alerts
    .filter(a => a.resolved === 0)
    .forEach(a => {
      const div = document.createElement('div');
      div.className = 'alert';

      div.innerHTML = `
        <span><b>${a.alert_type}</b> - ${a.device_id}</span>
        <button onclick="resolveAlert(${a.id})">Resolve</button>
      `;

      alertBox.appendChild(div);
    });
}

setInterval(load, 2000);
</script>

</body>
</html>
