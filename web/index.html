<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fleet Dashboard</title>

<style>
body {
  background: #0f172a;
  color: #e2e8f0;
  font-family: Arial;
  padding: 20px;
}

h1 { margin-bottom: 20px; }

.cards {
  display: flex;
  gap: 20px;
  margin-bottom: 30px;
}

.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 10px;
  width: 150px;
}

.devices {
  background: #1e293b;
  padding: 20px;
  border-radius: 10px;
}

.device {
  padding: 10px;
  border-bottom: 1px solid #334155;
}

.healthy { color: #22c55e; }
.warning { color: #eab308; }
.error { color: #ef4444; }
</style>

<script>
async function load() {
  const res = await fetch('/api/fleet/status');
  const data = await res.json();

  document.getElementById('total').innerText = data.total_devices;
  document.getElementById('healthy').innerText = data.healthy;
  document.getElementById('warning').innerText = data.warning;
  document.getElementById('error').innerText = data.error;

  const container = document.getElementById('devices');
  container.innerHTML = '';

  data.devices.forEach(d => {
    const div = document.createElement('div');
    div.className = 'device ' + d.status;
    div.innerText = `${d.device_id} | Temp: ${d.temperature_c}°C | CPU: ${d.cpu_usage}% | Errors: ${d.error_count} | Status: ${d.status}`;
    container.appendChild(div);
  });
}

setInterval(load, 2000);
</script>
</head>

<body>

<h1>⚙️ Fleet Dashboard</h1>

<div class="cards">
  <div class="card">Total<br><h2 id="total">0</h2></div>
  <div class="card healthy">Healthy<br><h2 id="healthy">0</h2></div>
  <div class="card warning">Warning<br><h2 id="warning">0</h2></div>
  <div class="card error">Error<br><h2 id="error">0</h2></div>
</div>

<div class="devices">
  <h2>Devices</h2>
  <div id="devices"></div>
</div>

</body>
</html>
